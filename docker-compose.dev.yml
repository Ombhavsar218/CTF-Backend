# Local Docker development/testing stack for Flaghunt backend.
#
# This file is for local development/testing only. It is NOT a Render
# deployment file. Render should deploy the backend as a Docker Web Service
# using the Dockerfile in this directory.
#
# Usage (from ctf-platform-be/):
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml run --rm backend python manage.py migrate
#   docker compose -f docker-compose.dev.yml run --rm backend python manage.py createsuperuser

name: flaghunt-backend-dev

x-backend-env: &backend-env
  ENVIRONMENT: development
  DJANGO_SETTINGS_MODULE: config.settings
  DEBUG: "True"
  SECRET_KEY: dev-only-insecure-secret-key-for-local-docker-compose
  ALLOWED_HOSTS: localhost,127.0.0.1,[::1],backend
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  TRUST_PROXY_HEADERS: "False"
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: flaghunt
  DB_USER: flaghunt
  DB_PASSWORD: flaghunt
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_CONN_MAX_AGE: "60"
  DB_CONNECT_TIMEOUT: "5"
  CELERY_BROKER_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: ""
  CHANNEL_LAYER_REDIS_URL: redis://redis:6379/2
  DJANGO_WAIT_FOR_DB: "True"
  DJANGO_COLLECTSTATIC_ON_START: "True"
  DJANGO_RUN_CHECKS: "False"
  DJANGO_RUN_DEPLOY_CHECKS: "False"
  PORT: "8000"
  GUNICORN_WORKERS: "2"
  GUNICORN_TIMEOUT: "60"
  LOG_LEVEL: INFO
  DJANGO_LOG_LEVEL: INFO
  REQUEST_LOG_ENABLED: "True"
  FLAGHUNT_TERMINAL_ENABLED: "True"

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  # Local dev convenience: bind mounts and named volumes are easier to manage as root.
  # Production image defaults to non-root user.
  user: "0"
  env_file:
    - path: .env
      required: false
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flaghunt
      POSTGRES_USER: flaghunt
      POSTGRES_PASSWORD: flaghunt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaghunt -d flaghunt"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    <<: *backend-service
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/live/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    <<: *backend-service
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - .:/app
      - backend_media:/app/media
    restart: unless-stopped

  celery-beat:
    <<: *backend-service
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/var/lib/celery/celerybeat.pid"]
    volumes:
      - .:/app
      - celerybeat_state:/var/lib/celery
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  celerybeat_state:
