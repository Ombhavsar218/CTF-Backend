name: Production Migration Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-plan:
    name: Inspect Django migration plan (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENVIRONMENT: production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      CACHE_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_HSTS_SECONDS: "3600"
      CSP_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-production.txt
            requirements.txt

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Generate ephemeral Django SECRET_KEY
        run: |
          set -euo pipefail
          SECRET_KEY_VALUE="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::${SECRET_KEY_VALUE}"
          echo "SECRET_KEY=${SECRET_KEY_VALUE}" >> "$GITHUB_ENV"

      - name: Validate required secret is present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty."
            exit 1
          fi

      - name: Run Django migration plan (read-only)
        run: |
          set -euo pipefail
          python manage.py migrate --plan 2>&1 | python -c '
          import os, sys
          secret = os.environ.get("DATABASE_URL", "")
          for line in sys.stdin:
              if secret:
                  line = line.replace(secret, "***DATABASE_URL_REDACTED***")
              sys.stdout.write(line)
          sys.stdout.flush()
          ' || {
            status=$?
            echo "::error::Django migration plan failed. Check database connectivity and Django initialization."
            exit "$status"
          }
