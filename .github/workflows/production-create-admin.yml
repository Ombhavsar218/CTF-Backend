name: Production Create Admin

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to confirm production superuser creation."
        required: true
        type: string
      username:
        description: "Admin username (Django USERNAME_FIELD)."
        required: true
        type: string
      email:
        description: "Admin email (required by createsuperuser for this model)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-admin:
    name: Create Django production superuser (noinput)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENVIRONMENT: production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      CACHE_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CHANNEL_LAYER_REDIS_URL: redis://127.0.0.1:6379/2
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_HSTS_SECONDS: "3600"
      CSP_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    steps:
      - name: Validate confirmation input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION}" != "APPLY" ]; then
            echo "::error::Confirmation failed. You must type exactly APPLY to create a production superuser."
            exit 1
          fi
          echo "Confirmation received."

      - name: Validate admin identity inputs
        env:
          ADMIN_USERNAME: ${{ inputs.username }}
          ADMIN_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_USERNAME}" ]; then
            echo "::error::Admin username is required."
            exit 1
          fi
          if [ -z "${ADMIN_EMAIL}" ]; then
            echo "::error::Admin email is required."
            exit 1
          fi
          echo "Admin identity inputs present."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-production.txt
            requirements.txt

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Generate ephemeral Django SECRET_KEY
        run: |
          set -euo pipefail
          SECRET_KEY_VALUE="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::${SECRET_KEY_VALUE}"
          echo "SECRET_KEY=${SECRET_KEY_VALUE}" >> "$GITHUB_ENV"

      - name: Validate required secrets are present
        env:
          FLAGHUNT_ADMIN_PASSWORD: ${{ secrets.FLAGHUNT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty."
            exit 1
          fi
          if [ -z "${FLAGHUNT_ADMIN_PASSWORD:-}" ]; then
            echo "::error::FLAGHUNT_ADMIN_PASSWORD secret is missing or empty. Configure it before running this workflow."
            exit 1
          fi
          echo "Required secrets are present."

      - name: Check for existing account (no modification)
        env:
          ADMIN_USERNAME: ${{ inputs.username }}
          ADMIN_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          # Read-only check: fails if username or email already exists.
          # Does not create, modify, reset password, or change groups/roles.
          python manage.py shell -c '
          import os, sys
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get("ADMIN_USERNAME", "")
          email = os.environ.get("ADMIN_EMAIL", "")
          # Use all_objects to include soft-deleted rows; username is DB-unique.
          manager = getattr(User, "all_objects", User._default_manager)
          username_exists = manager.filter(username=username).exists()
          email_exists = manager.filter(email__iexact=email).exists() if email else False
          if username_exists or email_exists:
              if username_exists:
                  print("ERROR: An account with the requested username already exists. Refusing to modify existing accounts.")
              if email_exists:
                  print("ERROR: An account with the requested email already exists. Refusing to modify existing accounts.")
              sys.exit(1)
          print("No existing account found for requested username/email.")
          ' 2>&1 | python -c '
          import os, sys
          secret = os.environ.get("DATABASE_URL", "")
          for line in sys.stdin:
              if secret:
                  line = line.replace(secret, "***DATABASE_URL_REDACTED***")
              sys.stdout.write(line)
          sys.stdout.flush()
          ' || {
            status=$?
            echo "::error::Preflight account check failed or found an existing account. No user was created or modified."
            exit "$status"
          }

      - name: Create Django superuser (noinput)
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ inputs.username }}
          DJANGO_SUPERUSER_EMAIL: ${{ inputs.email }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.FLAGHUNT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Uses Django's supported createsuperuser --noinput with DJANGO_SUPERUSER_* env vars.
          # Does not run migrations, assign groups, change roles, reset passwords, or modify existing users.
          python manage.py createsuperuser --noinput 2>&1 | python -c '
          import os, sys
          secret = os.environ.get("DATABASE_URL", "")
          pw = os.environ.get("DJANGO_SUPERUSER_PASSWORD", "")
          for line in sys.stdin:
              if secret:
                  line = line.replace(secret, "***DATABASE_URL_REDACTED***")
              if pw:
                  line = line.replace(pw, "***PASSWORD_REDACTED***")
              sys.stdout.write(line)
          sys.stdout.flush()
          ' || {
            status=$?
            echo "::error::createsuperuser failed. Review redacted output above. No password reset or existing-user modification was attempted by this workflow."
            exit "$status"
          }

      - name: Verify created superuser (read-only)
        env:
          ADMIN_USERNAME: ${{ inputs.username }}
        run: |
          set -euo pipefail
          # Read-only verification: confirms superuser exists and has is_superuser/is_staff.
          # Does not modify account, role, groups, or password.
          python manage.py shell -c '
          import os, sys
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get("ADMIN_USERNAME", "")
          manager = getattr(User, "all_objects", User._default_manager)
          try:
              u = manager.get(username=username)
          except User.DoesNotExist:
              print("ERROR: Superuser was not found after creation.")
              sys.exit(1)
          if not u.is_superuser or not u.is_staff:
              print("ERROR: Created account is missing is_superuser/is_staff flags.")
              sys.exit(1)
          print("Superuser verification passed (is_superuser=True, is_staff=True).")
          ' 2>&1 | python -c '
          import os, sys
          secret = os.environ.get("DATABASE_URL", "")
          for line in sys.stdin:
              if secret:
                  line = line.replace(secret, "***DATABASE_URL_REDACTED***")
              sys.stdout.write(line)
          sys.stdout.flush()
          ' || {
            status=$?
            echo "::error::Post-create verification failed. Inspect account state manually; do not rerun create blindly."
            exit "$status"
          }
